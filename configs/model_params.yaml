lightgbm:
  objective: "multiclass"
  boosting_type: "gbdt"
  n_estimators: 300
  learning_rate: 0.05
  num_leaves: 63
  max_depth: -1
  subsample: 0.8
  colsample_bytree: 0.8
  class_weight: "balanced"
  random_state: 42
  n_jobs: -1
  verbose: -1

xgboost:
  objective: "multi:softprob"
  booster: "gbtree"
  n_estimators: 300
  learning_rate: 0.05
  max_depth: 6
  subsample: 0.8
  colsample_bytree: 0.8
  random_state: 42
  n_jobs: -1
  tree_method: "hist"

ensemble:
  n_bootstrap: 25
  subsample_ratio: 0.8
  aggregation: "mean"
  